name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  self-scan:
    name: Scan this repository with LeakLens
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so --history can walk every commit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scan working tree and history
        run: npx tsx src/cli/index.ts scan . --history --fail-on low
      - name: Produce SARIF for code scanning
        if: always()
        run: npx tsx src/cli/index.ts scan . --history --format sarif --output leaklens.sarif --fail-on none
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: leaklens.sarif
          category: leaklens
